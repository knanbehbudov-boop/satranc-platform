# Yerelde tek komutla: docker compose up --build   →   http://localhost:8080
# Geliştirme ayarlarıdır (geliştirme posta kutusu açık). Üretimde kullanmayın.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: satranc
      POSTGRES_PASSWORD: satranc-dev
      POSTGRES_DB: satranc
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satranc -d satranc"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://satranc:satranc-dev@db:5432/satranc
      JWT_SECRET: yerel-gelistirme-anahtari-uretimde-mutlaka-degistirin
      DEV_MAILBOX: "1"
      # Stockfish kurulu bir imaj kullanılırsa: STOCKFISH_PATH: /usr/games/stockfish
    ports:
      - "8080:8080"

volumes:
  pgdata:
